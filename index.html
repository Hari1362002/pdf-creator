<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Creator — Tamil & English notice maker</title>
  <meta name="description" content="Click anywhere on an A4 page, type in Tamil or English, change the font and size, and download it as a PDF or image. Free notice, poster and leave-notice maker.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="PDF Creator — Tamil & English notice maker">
  <meta property="og:description" content="Click anywhere, type Tamil or English, download as PDF. Free.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;700;900&family=Catamaran:wght@400;700;900&family=Mukta+Malar:wght@400;700;800&family=Hind+Madurai:wght@400;700&family=Baloo+Thambi+2:wght@400;700;800&family=Anek+Tamil:wght@400;700;800&family=Arima:wght@400;700&family=Noto+Serif+Tamil:wght@400;700;900&family=Tiro+Tamil&family=Pavanam&family=Kavivanar&family=Coiny&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<header class="topbar">
  <a class="brand" href="./" aria-label="PDF Creator">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
    </span>
    <span class="brand-name">PDF Creator</span>
  </a>
  <div class="topbar-actions">
    <button type="button" class="btn" id="btn-share" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
      Share
    </button>
    <button type="button" class="btn" id="btn-png">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      Image
    </button>
    <button type="button" class="btn primary" id="btn-pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      Download PDF
    </button>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="field">
    <span>Font</span>
    <select id="font-family" aria-label="Font"></select>
  </div>

  <div class="field">
    <span>Size</span>
    <div class="row">
      <div class="stepper">
        <button type="button" data-step="-2" aria-label="Smaller">−</button>
        <input type="number" id="font-size" min="8" max="300" step="1" value="48" aria-label="Font size">
        <button type="button" data-step="2" aria-label="Bigger">+</button>
      </div>
      <input type="range" id="font-range" min="8" max="200" value="48" aria-label="Font size slider">
    </div>
  </div>

  <div class="field">
    <span>Style</span>
    <div class="row">
      <button type="button" class="tbtn" id="bold" aria-pressed="true" title="Bold" aria-label="Bold"><b>B</b></button>
      <div class="segmented" id="align" role="group" aria-label="Align">
        <button type="button" data-align="left" title="Align left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h14"/></svg></button>
        <button type="button" data-align="center" title="Align center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M7 12h10M5 18h14"/></svg></button>
        <button type="button" data-align="right" title="Align right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M10 12h10M6 18h14"/></svg></button>
      </div>
    </div>
  </div>

  <div class="field">
    <span>Color</span>
    <div class="swatches" id="swatches">
      <label class="custom-color" title="Custom color">
        <input type="color" id="color-pick" value="#111111" aria-label="Custom color">
      </label>
    </div>
  </div>

  <div class="field">
    <span>Text</span>
    <div class="row">
      <button type="button" class="tbtn" id="center-x" disabled title="Center on the page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18"/><path d="M5 8h4M15 8h4M3 16h6M15 16h6"/></svg>
        Center
      </button>
      <button type="button" class="tbtn danger" id="delete" disabled>Delete</button>
    </div>
  </div>

  <div class="field">
    <span>Page</span>
    <div class="row">
      <div class="segmented" id="orient" role="group" aria-label="Orientation">
        <button type="button" data-orient="portrait" class="is-on" title="Portrait" aria-label="Portrait"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="3" width="12" height="18" rx="2"/></svg></button>
        <button type="button" data-orient="landscape" title="Landscape" aria-label="Landscape"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="12" rx="2"/></svg></button>
      </div>
      <button type="button" class="tbtn" id="btn-sample">Sample</button>
      <button type="button" class="tbtn" id="btn-clear">Clear</button>
    </div>
  </div>
</div>

<div class="words" id="words" aria-label="Quick Tamil words">
  <span class="words-label">Tap to insert</span>
  <button type="button" class="chip chip-date" id="date-chip" title="Pick a date — adds it to the leave notice with its Tamil day">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Add date
  </button>
  <input type="date" id="date-pick" class="date-pick" aria-label="Pick a date" tabindex="-1">
</div>

<main class="workspace" id="workspace">
  <div class="page-wrap" id="page-wrap">
    <div class="page" id="page">
      <div class="hint" id="hint">
        <strong>Pick a date to make a leave notice</strong>
        <span>or click anywhere on the page and type — Tamil or English</span>
        <div class="hint-actions">
          <button type="button" class="hint-primary" id="hint-date">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            Pick a date
          </button>
          <button type="button" id="hint-sample">See a sample</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="measure" id="measure" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js?v=4"></script>
</body>
</html>
